<html>
  <head>
    <!--Include required JavaScript libraries and CSS files
    -->

    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.datatables.net/v/bs5/jq-3.7.0/jszip-3.10.1/dt-1.13.5/b-2.4.0/b-colvis-2.4.0/b-html5-2.4.0/b-print-2.4.0/datatables.min.css" rel="stylesheet"/>
    <link href="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.css" rel="stylesheet">
    <link href="demo.css" rel="stylesheet"/>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/v/bs5/jq-3.7.0/jszip-3.10.1/dt-1.13.5/b-2.4.0/b-colvis-2.4.0/b-html5-2.4.0/b-print-2.4.0/datatables.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <script type="text/javascript" src="demo.js"></script>

 

  </head>
  <body style="padding: 25px">
    <h1>Find a library database or AI feature</h1>

    <div class="filters-container" style="padding-bottom: 25px">
      <div class="filter-section">
        <h6>Filter by AI functionality</h6>
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter-type="aiTypes" data-filter-value="">Any feature</button>
          <button class="filter-btn" data-filter-type="aiTypes" data-filter-value="Summarization">Summarization</button>
          <button class="filter-btn" data-filter-type="aiTypes" data-filter-value="Search Interpretation">Search interpretation</button>
          <button class="filter-btn" data-filter-type="aiTypes" data-filter-value="Generative">Generative AI</button>
          <button class="filter-btn" data-filter-type="aiTypes" data-filter-value="Recommender">Recommender</button>
        </div>
      </div>

      <div class="filter-section">
        <h6>Governance quick views</h6>
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter-type="governance" data-filter-value="">All records</button>
          <button class="filter-btn" data-filter-type="governance" data-filter-value="aiOptional">AI optional</button>
          <button class="filter-btn" data-filter-type="governance" data-filter-value="noTraining">No model training</button>
          <button class="filter-btn" data-filter-type="governance" data-filter-value="notRetained">Data not retained</button>
          <button class="filter-btn" data-filter-type="governance" data-filter-value="needsReview" style="background-color: #3066BE; color: white;">Needs review</button>
        </div>
      </div>
    </div>

    <div class="filter-status">
      <span id="toolsShown"></span>
      <a href="#" id="clearFilters" style="display:none;">Clear filters</a>
    </div>

    <!--The script will write the table to this div
    -->
    <div id="googleSheetsDataTable">
    </div>

  </body>
</html>
